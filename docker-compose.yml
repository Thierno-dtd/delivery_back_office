version: '3.9'

services:

  # ===== POSTGRESQL =====
  postgres:
    image: postgres:16-alpine
    container_name: delivery_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-delivery_db}
      POSTGRES_USER: ${POSTGRES_USER:-delivery_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-delivery_password}
      TZ: Africa/Libreville
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-delivery_user} -d ${POSTGRES_DB:-delivery_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - delivery_network

  # ===== REDIS =====
  redis:
    image: redis:7-alpine
    container_name: delivery_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - delivery_network

  # ===== API PRINCIPALE =====
  delivery-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: delivery_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-delivery_db}
      DB_USERNAME: ${POSTGRES_USER:-delivery_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-delivery_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL}
      AUDIT_SERVICE_URL: ${AUDIT_SERVICE_URL}
      TZ: Africa/Libreville
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ./logs:/app/logs
    networks:
      - delivery_network

  # ===== PGADMIN (dev uniquement) =====
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: delivery_pgadmin
    restart: unless-stopped
    profiles:
      - dev                        # lancé seulement avec --profile dev
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@delivery.ga}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - delivery_network

# ===== VOLUMES =====
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ===== RÉSEAU =====
networks:
  delivery_network:
    driver: bridge