# ===== DATASOURCE POSTGRESQL =====
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/delivery_db}
spring.datasource.username=${DB_USERNAME:delivery_user}
spring.datasource.password=${DB_PASSWORD:delivery_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== HIKARI (pool de connexions) =====
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=DeliveryHikariPool

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===== REDIS =====
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=10
spring.data.redis.lettuce.pool.max-idle=5

# ===== LOGS =====
logging.level.root=WARN
logging.level.com.delivery=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.file.name=logs/delivery-api.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

# ===== SWAGGER DÉSACTIVÉ EN PROD =====
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# ===== PORT =====
server.port=${PORT:8080}