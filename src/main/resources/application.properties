spring.application.name=delivery-api
spring.profiles.active=dev

# ===== JACKSON =====
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.time-zone=Africa/Libreville

# ===== JPA COMMUN =====
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Africa/Libreville

# ===== SERVEUR =====
server.port=8080
server.servlet.context-path=/api
server.error.include-message=always
server.error.include-binding-errors=always

# ===== ACTUATOR =====
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ===== SWAGGER =====
springdoc.api-docs.path=/v1/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# ===== JWT (custom) =====
app.jwt.secret=${JWT_SECRET:delivery-gabon-secret-key-change-in-prod}
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# ===== MICROSERVICES (custom) =====
app.services.notification-url=${NOTIFICATION_SERVICE_URL:http://localhost:8081}
app.services.audit-url=${AUDIT_SERVICE_URL:http://localhost:8082}

# ===== BUSINESS (custom) =====
app.default-commission-rate=10.0

# ===== Firebase =====
app.firebase.credentials-path=classpath:firebase/firebase-credentials.json
app.firebase.database-url=https://delivery-gabon-default-rtdb.firebaseio.com